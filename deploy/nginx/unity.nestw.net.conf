# Nginx 站台設定：unity.nestw.net → Node.js (127.0.0.1:3001)
# 放到 /etc/nginx/sites-available/unity.nestw.net 並建立 sites-enabled 連結。
# 先用這份 HTTP 設定啟動，再執行：
#   sudo certbot --nginx -d unity.nestw.net
# certbot 會自動補上 443 / SSL 設定並把 HTTP 轉到 HTTPS。

server {
    listen 80;
    listen [::]:80;
    server_name unity.nestw.net;

    client_max_body_size 1m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
